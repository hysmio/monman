name: Release Windows build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate release tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $pattern = '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$'
          if ($env:RELEASE_TAG -notmatch $pattern) {
            throw "Release tag '$env:RELEASE_TAG' is not a valid v-prefixed semantic version"
          }

          $version = $Matches.version
          $manifestVersion = (Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -ne $manifestVersion) {
            throw "Tag version '$version' does not match Cargo.toml version '$manifestVersion'"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Prepare portable executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath target\release\monman.exe -Destination "dist\monman-$env:RELEASE_TAG-windows-x86_64.exe"

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DReleaseTag=$env:RELEASE_TAG" installer\monman.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Create release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $portable = "dist\monman-$env:RELEASE_TAG-windows-x86_64.exe#MonMan $env:RELEASE_TAG portable executable"
          $installer = "dist\monman-$env:RELEASE_TAG-windows-x86_64-setup.exe#MonMan $env:RELEASE_TAG installer"

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $portable $installer --clobber --repo $env:GITHUB_REPOSITORY
            exit $LASTEXITCODE
          }

          $releaseArgs = @(
            $env:RELEASE_TAG,
            $portable,
            $installer,
            '--verify-tag',
            '--generate-notes',
            '--title', "MonMan $env:RELEASE_TAG",
            '--repo', $env:GITHUB_REPOSITORY
          )
          if ($env:PRERELEASE -eq 'true') {
            $releaseArgs += '--prerelease'
          }
          gh release create @releaseArgs
