[package]
name = "monman"
version = "1.0.2"
edition = "2024"
description = "Windows monitor layout manager using CCD/DisplayConfig APIs"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = "=0.34.1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3.4", features = ["json"] }

[target.'cfg(windows)'.dependencies]
hidapi = "2"
windows = { version = "=0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
